<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>{{MODEL_NAME}} · Sharp GUI</title>
  <link rel="icon" type="image/png" sizes="96x96" href="{{FAVICON_DATA}}">
  <style>{{VIEWER_STYLE}}</style>
</head>
<body>
  <div id="share-root"><p style="padding:24px">正在打开 3D 模型… / Opening 3D model…</p></div>
  <noscript>此查看器需要启用 JavaScript。 / Enable JavaScript to view this model.</noscript>
  <span id="share-model-name" hidden>{{MODEL_NAME}}</span>
  <pre id="share-licenses" hidden>{{LICENSE_NOTICES}}</pre>
  <script type="application/json" id="share-manifest">{{VIEWER_MANIFEST}}</script>
  <script type="application/octet-stream" id="model-data-raw">{{MODEL_DATA}}</script>
  <script>{{VIEWER_SCRIPT}}</script>
</body>
</html>
