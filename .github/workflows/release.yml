name: Build and Release

on:
  push:
    tags:
      - "v*" # 当推送 v 开头的 tag 时触发

# 授予 GITHUB_TOKEN 写权限，用于创建 Release
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 安装 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 3. 构建前端
      # Delete macOS-generated lockfile before install so npm resolves
      # platform-specific optional deps correctly on Linux (e.g. @rollup/rollup-linux-x64-gnu).
      # See: https://github.com/npm/cli/issues/4828
      - name: Build Frontend
        run: |
          cd frontend
          rm -f package-lock.json
          npm install
          npm run build
          # The build above validates the frontend, but self-update bootstrap
          # requires every tracked archive byte to match the exact tag. Restore
          # the committed lockfile/dist snapshot and discard generated extras
          # before the generic Release ZIP is assembled.
          rm -rf dist
          git restore --source=HEAD --staged --worktree package-lock.json dist

      # 4. 创建发布包
      - name: Create Release Archive
        run: |
          VERSION=${{ github.ref_name }}
          SOURCE_VERSION="$(tr -d '\r\n' < version.txt)"
          if [ "$SOURCE_VERSION" != "$VERSION" ]; then
            echo "version.txt ($SOURCE_VERSION) does not match release tag ($VERSION)" >&2
            exit 1
          fi

          # 创建干净的发布目录
          mkdir -p release-build

          # 复制核心文件
          cp app.py release-build/
          cp install.sh install.bat run.sh run.bat build.sh build.bat update.sh update.bat release-build/
          cp README.md README.en.md LICENSE THIRD_PARTY_NOTICES.md update-manifest.json version.txt release-build/

          # 复制目录
          cp -r backend tools templates static release-build/
          cp -r frontend release-build/

          # 清理不需要的文件
          rm -rf release-build/frontend/node_modules
          rm -rf release-build/frontend/.vite
          rm -rf release-build/frontend/src  # 普通用户不需要源码

          # 创建 zip
          cd release-build
          zip -r ../sharp-gui-${VERSION}-source-install-required.zip .

          echo "Created: sharp-gui-${VERSION}-source-install-required.zip"
          ls -lh ../sharp-gui-${VERSION}-source-install-required.zip

      # 5. 上传到 Release
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .github/release-assets/00-*.txt
            sharp-gui-*-source-install-required.zip
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            ## 📥 Windows 完整便携包（推荐） / Full Windows Portable Packages (Recommended)

            **[网盘下载完整便携包 / Download full portable packages](https://pan.quark.cn/s/94f4acaada40)**

            > GitHub 下方的源码安装包与 Source code 不包含 Python/CUDA 运行环境和模型权重，需要另行安装依赖。完整便携包请使用上方网盘入口，按显卡选择并核对 SHA256。 / The source/install ZIP and Source code assets below do not include the Python/CUDA runtime or model weights. For a full portable package, use the download folder above, choose your GPU target, and verify SHA256.

            ---

            ## 📦 快速使用 (Quick Start)

            1. 完整便携包：从上方网盘下载，校验后解压并运行 `portable-run.bat` / Full portable: download above, verify SHA256, extract, and launch `portable-run.bat`.
            2. 源码安装包：下载 `sharp-gui-${{ github.ref_name }}-source-install-required.zip` / Source install: download the ZIP marked `source-install-required`.
            3. 源码安装包解压后运行安装脚本 / Source/install packages require installation:
               - **Linux/macOS**: `./install.sh && ./run.sh`
               - **Windows**: `install.bat` 然后 `run.bat`
            4. 浏览器访问 / Open `https://127.0.0.1:5050`

            📖 **详细教程 (中文)**: [查看 README](https://github.com/${{ github.repository }})

            📖 **English Guide**: [View README](https://github.com/${{ github.repository }}/blob/main/README.en.md)

            ---
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
